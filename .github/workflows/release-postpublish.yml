name: Release Postpublish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to verify
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [rc, beta, stable, maintenance]
      release_issue:
        description: Release issue number
        required: false
        type: string
      preflight_run_id:
        description: Exact approved release preflight run ID
        required: true
        type: string

jobs:
  postpublish:
    permissions:
      contents: read
      actions: read
    uses: OMT-Global/bootstrap/.github/workflows/release-postpublish-reusable.yml@9b77eaaa3ed9ad2da35ec1af9fe13d1563c7cce4
    with:
      tag: ${{ inputs.tag }}
      channel: ${{ inputs.channel }}
      release_issue: ${{ inputs.release_issue }}
      preflight_run_id: ${{ inputs.preflight_run_id }}
      postpublish_script: scripts/release/postpublish.sh
      artifact_dir: dist/release
      evidence_artifact_name: release-evidence
