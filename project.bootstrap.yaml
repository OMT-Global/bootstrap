  flowGovernance: false
  organization:
    defaultRepositoryPermission: read
    membersCanCreateRepositories: false
    membersCanCreatePublicRepositories: false
    membersCanCreatePrivateRepositories: false
    newRepositorySecurity:
      dependabotAlerts: true
      dependabotSecurityUpdates: true
      dependencyGraph: true
      secretScanning: true
      secretScanningPushProtection: true
  autoMerge: true
  deleteBranchOnMerge: true
  requiredApprovals: 1
  requiredStatusChecks:
    - CI Gate
  dismissStaleReviews: true
  requireCodeOwnerReviews: true
  requireLastPushApproval: true
  enforceLinearHistory: true
  allowMergeCommit: true
  allowSquashMerge: true
  allowRebaseMerge: false
  repoFeatures:
    hasIssues: true
    hasProjects: false
    hasWiki: false
    hasDiscussions: false
ci:
  runnerPolicy: github-hosted-first
  githubHostedImage: ubuntu-24.04
  nodeVersion: "20"
  pythonVersion: "3.12"
  fastChecks:
    - lint
    - typecheck
    - unit
    - build
    - secrets
  extendedChecks:
    - integration
    - release-readiness
  nightlyCron: 0 7 * * *
  codeqlLanguages:
    - javascript-typescript
  prGovernance:
    enforceAfter: 2026-07-13T23:00:00Z
  additionalWorkflows: []
  appPaths:
    - src/**
    - tests/**
    - test/**
    - profiles/**
    - policy/**
    - package*.json
    - tsconfig.json
    - vitest.config.ts
  ciPaths: []
  extendedPaths: []
  macosCheck:
    enabled: false
    paths: []
    runsOn:
      - macos-14
    command: xcodebuild -version
  customScripts:
    fast: >
      node -e 'if (Number(process.versions.node.split(".")[0]) < 20) { console.error("Bootstrap
      checks require Node.js 20 or newer."); process.exit(1); }'

      npm ci --ignore-scripts

      npm run typecheck

      npm test -- --maxWorkers=2

      npm run build
    extended: >
      bash scripts/ci/run-fast-checks.sh

      if [[ "${RELEASE_PROFILE:-}" == "full" ]]; then
        image='mcr.microsoft.com/devcontainers/javascript-node@sha256:447fa75fbc7123952284b50229148e933ea756c40718601fa0ec46edd29fd0c6'
        docker pull --platform linux/amd64 "$image"
        BOOTSTRAP_REQUIRE_ISOLATION_TESTS=1 npm test -- tests/isolated-validation-docker.test.ts --maxWorkers=1
      else
        echo "Actual Docker isolation tests require the full release-validation profile or the dedicated manual workflow."
      fi
  dependabot:
    enabled: true
    securityUpdates: true
    versionUpdates: true
    ecosystems:
      - packageEcosystem: npm
        directory: /
        interval: weekly
        groupMinorAndPatch: true
        ignoreMajorUpdates: true
      - packageEcosystem: github-actions
        directory: /
        interval: weekly
        groupMinorAndPatch: false
        ignoreMajorUpdates: true
  aiAttestation:
    enabled: true
    artifactName: ai-attestation
    retentionDays: 90
    provider: unknown
    model: unknown
    promptHash: unknown
    reusableWorkflowRepo: OMT-Global/bootstrap
    reusableWorkflowRef: d9c5bc7e50f4bcc97e4b4d3d2efc64e4ab3dca50
release:
  enabled: true
  maturity: governed
  tagPrefix: v
  createGitHubRelease: true
  updateMajorTag: true
  updateMinorTag: true
  reusableWorkflowRepo: OMT-Global/bootstrap
  reusableWorkflowRef: 9b77eaaa3ed9ad2da35ec1af9fe13d1563c7cce4
  postpublishRequiresPreflight: true
  changelog:
    enabled: true
    mode: github-generated-notes
    categories:
      - title: Features
        labels:
          - type:feature
      - title: Fixes
        labels:
          - type:bug
      - title: Operations
        labels:
          - area:infra
          - area:qa
      - title: Documentation
        labels:
          - kind:docs
          - documentation
  versions: []
  artifacts:
    directory: dist/release
    checksum: sha256
    sbom: optional
  publish:
    githubReleaseAssets: true
    packages: []
    containers: []
agents:
  manageCodexHome: true
  manageClaudeHome: false
  claudeProfile: default
  enableClaudeWebEnvironment: false
  enableClaudeDevcontainer: false
  enableClaudeGitHubAction: false
  codexProfile: default
  sharedSkills: []
policy:
  flow:
    ref: refs/tags/v1.0.1
    sha256: 52877f4225a192c6ac2250a7f289f479be83a923ce15152c517db77ab0d5249d
    bundlePath: policy/flow-public-standard.json
exceptions: []
environments:
  dev:
    reviewers: []
    requireApproval: false
    preventSelfReview: false
    branches: []
  stage:
    reviewers:
      - jmcte
    requireApproval: true
    preventSelfReview: true
    branches: []
  prod:
    reviewers:
      - jmcte
    requireApproval: true
    preventSelfReview: true
    branches:
      - main
