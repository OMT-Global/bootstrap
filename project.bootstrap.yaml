repo:
  class: cli
  classMigration:
    from: tooling
    target: cli
  managedPaths:
    - .githooks/pre-commit
    - .github/ISSUE_TEMPLATE/release_train.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/dependabot.yml
    - .github/release.yml
    - .github/workflows/ai-attestation.yml
    - .github/workflows/extended-validation.yml
    - .github/workflows/full-release-validation-reusable.yml
    - .github/workflows/full-release-validation.yml
    - .github/workflows/issue-hygiene.yml
    - .github/workflows/pr-fast-ci.yml
    - .github/workflows/release-postpublish-reusable.yml
    - .github/workflows/release-postpublish.yml
    - .github/workflows/release-preflight-reusable.yml
    - .github/workflows/release-preflight.yml
    - .github/workflows/release-publish-reusable.yml
    - .github/workflows/release-publish.yml
    - .github/workflows/security.yml
    - .gitignore
    - AGENTS.md
    - CODEOWNERS
    - SECURITY.md
    - docs/bootstrap/codex-cloud-environment.md
    - docs/bootstrap/issue-hygiene.md
    - docs/bootstrap/next-steps.md
    - docs/bootstrap/onboarding.md
    - docs/bootstrap/release-evidence-schema.md
    - docs/bootstrap/release-train-contract.md
    - docs/bootstrap/security.md
    - docs/bootstrap/versioning.md
    - docs/release-train.md
    - project.bootstrap.yaml
    - scripts/check-detect-secrets.sh
    - scripts/ci/check-action-pins.sh
    - scripts/ci/check-pr-governance.sh
    - scripts/ci/report-issue-hygiene.mjs
    - scripts/ci/run-extended-validation.sh
    - scripts/ci/run-fast-checks.sh
    - scripts/ci/run-release-build.sh
    - scripts/ci/run-release-publish.sh
    - scripts/ci/run-release-verification.sh
    - scripts/ci/run-release-version.sh
    - scripts/codex-cloud/maintenance.sh
    - scripts/codex-cloud/setup.sh
    - scripts/release/preflight.sh
    - scripts/release/publish.sh
    - scripts/release/validate.sh
  docs:
    readme: false
    contributing: false
    security: true
  templates:
    pullRequest: standard
    issueTemplates: []
  env:
    exampleFile: false
    strategy: optional
  hooks:
    preCommit: standard
    prePush: none
archetype:
  kind: generic-empty
  packageManager: npm
  moduleName: bootstrap
github:
  createRepo: true
  reviewers:
    - jmcte
  codeowners:
    - pattern: "*"
      owners:
        - "@jmcte"
        - "@athena-omt"
  issueLabels:
    - name: area:frontend
      color: 0969da
      description: Frontend, UX, UI, or client surface.
    - name: area:api
      color: 2ca02c
      description: API contracts, endpoints, and integrations.
    - name: area:data
      color: 0a7f83
      description: Data, schema, storage, privacy, or migration surface.
    - name: area:ledger
      color: 8c564b
      description: Ledger, accounting, transaction, or reconciliation work.
    - name: area:rules
      color: bcbd22
      description: Domain rules, policy logic, and decision engines.
    - name: area:ai
      color: bf3989
      description: AI/model/agent behavior surface.
    - name: area:infra
      color: 6f42c1
      description: Infrastructure, CI, release, governance, scripts, or repo setup.
    - name: area:security
      color: d1242f
      description: Security, auth, secret, permission, or policy surface.
    - name: area:accessibility
      color: e377c2
      description: Accessibility and inclusive UX work.
    - name: area:qa
      color: ff7f0e
      description: Quality assurance, test coverage, and release validation.
    - name: risk:low
      color: 2da44e
      description: Low-risk change.
    - name: risk:medium
      color: bf8700
      description: Medium-risk change; normal care required.
    - name: risk:high
      color: d1242f
      description: High-risk change; validation required.
    - name: risk:domain
      color: "5319e7"
      description: Domain correctness risk requiring subject-matter review.
    - name: risk:security
      color: a40e26
      description: Security-sensitive change.
    - name: risk:prod
      color: "000000"
      description: Production impact or rollout risk.
    - name: status:needs-spec
      color: cfd3d7
      description: Needs clearer scope, acceptance criteria, or constraints.
    - name: status:ready-for-agent
      color: "238636"
      description: Issue is approved for worker-lane execution.
    - name: status:agent-building
      color: 1d76db
      description: Agent implementation is in progress.
    - name: status:needs-review
      color: 1f6feb
      description: PR is ready for Athena review.
    - name: status:needs-human-approval
      color: d93f0b
      description: Needs explicit human approval before proceeding.
    - name: status:ready-to-merge
      color: 0e8a16
      description: Ready to merge after required checks pass.
    - name: status:blocked
      color: d1242f
      description: Work is blocked pending external input or a guard.
    - name: review:product
      color: 0052cc
      description: Needs product review.
    - name: review:architecture
      color: "5319e7"
      description: Needs architecture review.
    - name: review:security
      color: b60205
      description: Needs security review.
    - name: review:tax
      color: d4c5f9
      description: Needs tax review.
    - name: review:legal
      color: c2e0c6
      description: Needs legal review.
    - name: review:accessibility
      color: e99695
      description: Needs accessibility review.
    - name: review:release
      color: f9d0c4
      description: Needs release review.
  flowGovernance: false
  organization:
    defaultRepositoryPermission: read
    membersCanCreateRepositories: false
    membersCanCreatePublicRepositories: false
    membersCanCreatePrivateRepositories: false
    newRepositorySecurity:
      dependabotAlerts: true
      dependabotSecurityUpdates: true
      dependencyGraph: true
      secretScanning: true
      secretScanningPushProtection: true
  autoMerge: true
  deleteBranchOnMerge: true
  requiredApprovals: 1
  requiredStatusChecks:
    - CI Gate
  dismissStaleReviews: true
  requireCodeOwnerReviews: true
  requireLastPushApproval: true
  enforceLinearHistory: true
  allowMergeCommit: true
  allowSquashMerge: true
  allowRebaseMerge: false
  repoFeatures:
    hasIssues: true
    hasProjects: false
    hasWiki: false
    hasDiscussions: false
ci:
  runnerPolicy: github-hosted-first
  githubHostedImage: ubuntu-24.04
  nodeVersion: "20"
  pythonVersion: "3.12"
  fastChecks:
    - lint
    - typecheck
    - unit
    - build
    - secrets
  extendedChecks:
    - integration
    - release-readiness
  nightlyCron: 0 7 * * *
  codeqlLanguages:
    - javascript-typescript
  prGovernance:
    enforceAfter: 2026-07-13T23:00:00Z
  additionalWorkflows: []
  appPaths:
    - src/**
    - tests/**
    - test/**
    - profiles/**
    - policy/**
    - package*.json
    - tsconfig.json
    - vitest.config.ts
  ciPaths: []
  extendedPaths: []
  macosCheck:
    enabled: false
    paths: []
    runsOn:
      - macos-14
    command: xcodebuild -version
  customScripts:
    fast: >
      node -e 'if (Number(process.versions.node.split(".")[0]) < 20) { console.error("Bootstrap
      checks require Node.js 20 or newer."); process.exit(1); }'

      npm ci --ignore-scripts

      npm run typecheck

      npm test -- --maxWorkers=2

      npm run build
    extended: >
      bash scripts/ci/run-fast-checks.sh

      if [[ "${RELEASE_PROFILE:-}" == "full" ]]; then
        image='mcr.microsoft.com/devcontainers/javascript-node@sha256:7f53703699da429555e7eebed7047e12823dac65508831413b5485e4566c00a8'
        docker pull --platform linux/amd64 "$image"
        BOOTSTRAP_REQUIRE_ISOLATION_TESTS=1 npm test -- tests/isolated-validation-docker.test.ts --maxWorkers=1
        python3 scripts/ci/reviewer-artifacts.py
      else
        echo "Actual Docker isolation tests require the full release-validation profile or the dedicated manual workflow."
      fi
  dependabot:
    enabled: true
    securityUpdates: true
    versionUpdates: true
    ecosystems:
      - packageEcosystem: npm
        directory: /
        interval: weekly
        groupMinorAndPatch: true
        ignoreMajorUpdates: true
      - packageEcosystem: github-actions
        directory: /
        interval: weekly
        groupMinorAndPatch: false
        ignoreMajorUpdates: true
  aiAttestation:
    enabled: true
    artifactName: ai-attestation
    retentionDays: 90
    provider: unknown
    model: unknown
    promptHash: unknown
    reusableWorkflowRepo: OMT-Global/bootstrap
    reusableWorkflowRef: d9c5bc7e50f4bcc97e4b4d3d2efc64e4ab3dca50
release:
  enabled: true
  maturity: governed
  tagPrefix: v
  createGitHubRelease: true
  updateMajorTag: true
  updateMinorTag: true
  reusableWorkflowRepo: OMT-Global/bootstrap
  reusableWorkflowRef: 4062ce00d678555fd6c711c0df9f0d28ec6627ab
  postpublishRequiresPreflight: true
  approvedRetry: true
  approvedPublication: true
  approvedAliases: true
  changelog:
    enabled: true
    mode: github-generated-notes
    categories:
      - title: Features
        labels:
          - type:feature
      - title: Fixes
        labels:
          - type:bug
      - title: Operations
        labels:
          - area:infra
          - area:qa
      - title: Documentation
        labels:
          - kind:docs
          - documentation
  versions: []
  artifacts:
    directory: dist/release
    checksum: sha256
    sbom: optional
  publish:
    githubReleaseAssets: true
    packages: []
    containers: []
agents:
  manageCodexHome: true
  manageClaudeHome: false
  claudeProfile: default
  enableClaudeWebEnvironment: false
  enableClaudeDevcontainer: false
  enableClaudeGitHubAction: false
  codexProfile: default
  sharedSkills: []
policy:
  flow:
    ref: refs/tags/v1.0.1
    sha256: 52877f4225a192c6ac2250a7f289f479be83a923ce15152c517db77ab0d5249d
    bundlePath: policy/flow-public-standard.json
exceptions: []
environments:
  dev:
    reviewers: []
    requireApproval: false
    preventSelfReview: false
    branches: []
  stage:
    reviewers:
      - jmcte
      - athena-omt
    requireApproval: true
    preventSelfReview: true
    branches: []
  prod:
    reviewers:
      - jmcte
      - athena-omt
    requireApproval: true
    preventSelfReview: true
    branches:
      - main
  release-publish:
    reviewers:
      - jmcte
      - athena-omt
    requireApproval: true
    preventSelfReview: true
    branches:
      - main
