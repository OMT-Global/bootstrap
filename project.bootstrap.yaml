  classMigration:
    from: tooling
    target: cli
  managedPaths:
    - .githooks/pre-commit
    - .github/ISSUE_TEMPLATE/release_train.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/dependabot.yml
    - .github/release.yml
    - .github/workflows/ai-attestation.yml
    - .github/workflows/extended-validation.yml
    - .github/workflows/full-release-validation-reusable.yml
    - .github/workflows/full-release-validation.yml
    - .github/workflows/issue-hygiene.yml
    - .github/workflows/pr-fast-ci.yml
    - .github/workflows/release-postpublish-reusable.yml
    - .github/workflows/release-postpublish.yml
    - .github/workflows/release-preflight-reusable.yml
    - .github/workflows/release-preflight.yml
    - .github/workflows/release-publish-reusable.yml
    - .github/workflows/release-publish.yml
    - .github/workflows/security.yml
    - .gitignore
    - AGENTS.md
    - CODEOWNERS
    - SECURITY.md
    - docs/bootstrap/codex-cloud-environment.md
    - docs/bootstrap/issue-hygiene.md
    - docs/bootstrap/next-steps.md
    - docs/bootstrap/onboarding.md
    - docs/bootstrap/release-evidence-schema.md
    - docs/bootstrap/release-train-contract.md
    - docs/bootstrap/security.md
    - docs/bootstrap/versioning.md
    - docs/release-train.md
    - project.bootstrap.yaml
    - scripts/check-detect-secrets.sh
    - scripts/ci/check-action-pins.sh
    - scripts/ci/check-pr-governance.sh
    - scripts/ci/report-issue-hygiene.mjs
    - scripts/ci/run-extended-validation.sh
    - scripts/ci/run-fast-checks.sh
    - scripts/ci/run-release-build.sh
    - scripts/ci/run-release-publish.sh
    - scripts/ci/run-release-verification.sh
    - scripts/ci/run-release-version.sh
    - scripts/codex-cloud/maintenance.sh
    - scripts/codex-cloud/setup.sh
    - scripts/release/preflight.sh
    - scripts/release/publish.sh
    - scripts/release/validate.sh
  docs:
    readme: false
    contributing: false
    security: true
  templates:
    pullRequest: standard
    issueTemplates: []
  env:
    exampleFile: false
    strategy: optional
  hooks:
    preCommit: standard
    prePush: none
archetype:
  kind: generic-empty
  packageManager: npm
  moduleName: bootstrap
github:
  createRepo: true
  reviewers:
    - jmcte
  codeowners:
    - pattern: "*"
      owners:
        - "@jmcte"
        - "@athena-omt"
  issueLabels:
    - name: area:frontend
      color: 1f77b4
      description: Frontend and user-interface work.
    - name: area:api
      color: 2ca02c
      description: API contracts, endpoints, and integrations.
    - name: area:data
      color: 9467bd
      description: Data models, persistence, migration, and analytics work.
    - name: area:ledger
